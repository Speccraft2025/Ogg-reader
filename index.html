<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enhanced OGG Metadata Editor</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      background: #121212; 
      color: #eee; 
      padding: 20px; 
      max-width: 1200px; 
      margin: 0 auto; 
    }
    .drop-zone { 
      border: 2px dashed #666; 
      padding: 30px; 
      text-align: center; 
      margin-bottom: 20px; 
      border-radius: 8px;
      transition: all 0.3s ease;
      cursor: pointer;
    }
    .drop-zone.dragover { 
      border-color: #0f0; 
      background: rgba(0, 255, 0, 0.1); 
    }
    audio { 
      width: 100%; 
      margin: 20px 0; 
      background: #222;
      border-radius: 4px;
    }
    .metadata-section {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
    table { 
      width: 100%; 
      border-collapse: collapse; 
      margin: 20px 0; 
      background: #222;
      border-radius: 4px;
      overflow: hidden;
    }
    th { 
      background: #333; 
      padding: 12px; 
      text-align: left;
      font-weight: bold;
    }
    td { 
      padding: 10px; 
      border-bottom: 1px solid #444; 
    }
    tr:last-child td {
      border-bottom: none;
    }
    input[type="text"], select, input[type="file"] { 
      width: 100%; 
      padding: 8px; 
      background: #333; 
      color: #eee; 
      border: 1px solid #555; 
      border-radius: 4px;
      box-sizing: border-box;
    }
    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: #666;
      background: #444;
    }
    button { 
      margin: 5px; 
      padding: 10px 15px; 
      background: #0066cc; 
      color: white; 
      border: none; 
      cursor: pointer; 
      border-radius: 4px;
      font-size: 14px;
      transition: background 0.2s ease;
    }
    button:hover { 
      background: #0080ff; 
    }
    button.secondary {
      background: #444;
    }
    button.secondary:hover {
      background: #666;
    }
    button.danger {
      background: #cc3333;
    }
    button.danger:hover {
      background: #ff4444;
    }
    .add-field-section {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 4px;
      margin: 10px 0;
    }
    .add-field-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 10px;
    }
    .add-field-row input, .add-field-row select {
      flex: 1;
    }
    .file-info {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
    }
    .file-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin: 15px 0;
    }
    .file-basic-info, .file-metadata-list {
      background: #333;
      padding: 15px;
      border-radius: 4px;
    }
    .metadata-item {
      display: flex;
      align-items: center;
      margin: 5px 0;
      padding: 3px 0;
    }
    .metadata-item .checkmark {
      color: #4a4;
      font-weight: bold;
      margin-right: 8px;
    }
    .metadata-item .key {
      font-weight: bold;
      min-width: 120px;
      color: #0080ff;
    }
    .metadata-item .value {
      color: #ccc;
      word-break: break-all;
    }
    .status {
      padding: 10px;
      margin: 10px 0;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      background: rgba(0, 255, 0, 0.2);
      border: 1px solid #0a0;
    }
    .status.error {
      background: rgba(255, 0, 0, 0.2);
      border: 1px solid #a00;
    }
    .status.show {
      display: block;
    }
    .original-field {
      background: rgba(0, 255, 0, 0.05);
      border-left: 3px solid #4a4;
    }
    .added-field {
      background: rgba(0, 128, 255, 0.05);
      border-left: 3px solid #0080ff;
    }

    @media (max-width: 768px) {
      .file-info-grid {
        grid-template-columns: 1fr;
      }
      .add-field-row {
        flex-direction: column;
        align-items: stretch;
      }
    }
  </style>
</head>
<body>
  <h1>Enhanced OGG Metadata Editor</h1>

  <!-- File Upload -->
  <div class="drop-zone" id="dropZone">
    <p>🎵 Drag & Drop OGG file here or click to browse</p>
  </div>
  <input type="file" id="fileInput" accept=".ogg" style="display: none;">

  <!-- File Info -->
  <div class="file-info" id="fileInfo" style="display: none;">
    <h3>File Information</h3>
    <div class="file-info-grid">
      <div class="file-basic-info">
        <h4>Basic Info</h4>
        <p id="fileName"></p>
        <p id="fileSize"></p>
      </div>
      <div class="file-metadata-list">
        <h4>Metadata Found (<span id="metadataCount">0</span> fields)</h4>
        <div id="metadataFound">
          <p style="color: #888;">Loading metadata...</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Audio Player -->
  <audio id="audioPlayer" controls style="display: none;"></audio>

  <!-- Status Messages -->
  <div class="status" id="statusMsg"></div>

  <!-- Metadata Section -->
  <div class="metadata-section" id="metadataSection" style="display: none;">
    <h2>Metadata Editor</h2>
    
    <form id="metadataForm">
      <table>
        <thead>
          <tr>
            <th style="width: 200px;">Field Name</th>
            <th>Value</th>
            <th style="width: 100px;">Actions</th>
          </tr>
        </thead>
        <tbody id="metadataTableBody">
        </tbody>
      </table>
      
      <!-- Add New Field -->
      <div class="add-field-section">
        <h4>Add New Metadata Field</h4>
        <div class="add-field-row">
          <select id="newFieldType">
            <option value="">Select a field to add...</option>
          </select>
          <input type="text" id="newFieldName" placeholder="Field name (if custom)" style="display: none;">
          <input type="text" id="newFieldValue" placeholder="Field value">
          <button type="button" id="addFieldBtn" class="secondary">Add Field</button>
        </div>
      </div>

      <button type="submit">💾 Save Metadata to File</button>
    </form>
    
    <!-- Download Section -->
    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #444;">
      <h3>Download</h3>
      <a id="downloadLink" style="display:none; color: #0080ff; text-decoration: none;">📥 Download Metadata File</a>
    </div>
  </div>

  <script>
    // Global variables
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const audioPlayer = document.getElementById("audioPlayer");
    const metadataTableBody = document.getElementById("metadataTableBody");
    const metadataForm = document.getElementById("metadataForm");
    const metadataSection = document.getElementById("metadataSection");
    const fileInfo = document.getElementById("fileInfo");
    const fileName = document.getElementById("fileName");
    const fileSize = document.getElementById("fileSize");
    const statusMsg = document.getElementById("statusMsg");
    const newFieldType = document.getElementById("newFieldType");
    const newFieldName = document.getElementById("newFieldName");
    const newFieldValue = document.getElementById("newFieldValue");
    const addFieldBtn = document.getElementById("addFieldBtn");
    const downloadLink = document.getElementById("downloadLink");
    const metadataFound = document.getElementById("metadataFound");
    const metadataCount = document.getElementById("metadataCount");

    let currentFile;
    let metadata = {};
    let originalMetadata = {};
    let addedFields = new Set();

    // Field definitions
    const fieldDefinitions = {
      'TITLE': { name: 'Title', type: 'text' },
      'ARTIST': { name: 'Artist', type: 'text' },
      'ALBUM': { name: 'Album', type: 'text' },
      'DATE': { name: 'Date', type: 'text' },
      'GENRE': { name: 'Genre', type: 'text' },
      'TRACKNUMBER': { name: 'Track Number', type: 'text' },
      'ALBUMARTIST': { name: 'Album Artist', type: 'text' },
      'COMPOSER': { name: 'Composer', type: 'text' },
      'PERFORMER': { name: 'Performer', type: 'text' },
      'COMMENT': { name: 'Comment', type: 'text' },
      'DESCRIPTION': { name: 'Description', type: 'text' },
      'COPYRIGHT': { name: 'Copyright', type: 'text' },
      'LICENSE': { name: 'License', type: 'text' },
      'LANGUAGE': { name: 'Language', type: 'text' },
      'PUBLISHER': { name: 'Publisher', type: 'text' },
      'ISRC': { name: 'ISRC', type: 'text' },
      'DISCNUMBER': { name: 'Disc Number', type: 'text' },
      'LABEL': { name: 'Label', type: 'text' },
      'CONDUCTOR': { name: 'Conductor', type: 'text' },
      'LYRICIST': { name: 'Lyricist', type: 'text' },
      'PRODUCER': { name: 'Producer', type: 'text' },
      'ARRANGER': { name: 'Arranger', type: 'text' },
      'ENGINEER': { name: 'Engineer', type: 'text' },
      'MIXER': { name: 'Mixer', type: 'text' },
      'ORGANIZATION': { name: 'Organization', type: 'text' },
      'LOCATION': { name: 'Location', type: 'text' },
      'CONTACT': { name: 'Contact', type: 'text' },
      'VERSION': { name: 'Version', type: 'text' },
      'SUBTITLE': { name: 'Subtitle', type: 'text' }
    };

    // Valid metadata field patterns
    const VALID_FIELD_PATTERN = /^[A-Z][A-Z0-9_]*$/;
    const MIN_FIELD_LENGTH = 2;
    const MAX_FIELD_LENGTH = 50;
    const MAX_VALUE_LENGTH = 1000;

    // Show status message
    function showStatus(message, type = 'success') {
      statusMsg.textContent = message;
      statusMsg.className = `status ${type} show`;
      setTimeout(() => {
        statusMsg.classList.remove('show');
      }, 3000);
    }

    // File size formatter
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Validate metadata field
    function isValidMetadataField(key, value) {
      if (!key || !value) return false;
      
      // Check field name format
      if (!VALID_FIELD_PATTERN.test(key)) return false;
      if (key.length < MIN_FIELD_LENGTH || key.length > MAX_FIELD_LENGTH) return false;
      
      // Check value length
      if (value.length > MAX_VALUE_LENGTH) return false;
      
      // Check if value contains only printable characters
      if (!/^[\x20-\x7E\u00A0-\uFFFF]*$/.test(value)) return false;
      
      // Exclude common binary or corrupted patterns
      if (value.includes('\x00') || value.includes('\uFFFD')) return false;
      if (/^[\x00-\x1F]*$/.test(value)) return false; // Only control characters
      
      return true;
    }

    // Clean and filter metadata
    function cleanMetadata(rawMetadata) {
      const cleaned = {};
      
      for (const [key, value] of Object.entries(rawMetadata)) {
        const cleanKey = key.trim().toUpperCase();
        const cleanValue = value.trim();
        
        if (isValidMetadataField(cleanKey, cleanValue)) {
          cleaned[cleanKey] = cleanValue;
        }
      }
      
      return cleaned;
    }

    // Update available fields dropdown
    function updateAvailableFields() {
      newFieldType.innerHTML = '<option value="">Select a field to add...</option>';
      
      for (const [key, def] of Object.entries(fieldDefinitions)) {
        if (!metadata.hasOwnProperty(key)) {
          const option = document.createElement('option');
          option.value = key;
          option.textContent = def.name;
          newFieldType.appendChild(option);
        }
      }
      
      // Add custom option
      const customOption = document.createElement('option');
      customOption.value = 'custom';
      customOption.textContent = 'Custom Field';
      newFieldType.appendChild(customOption);
    }

    // Drag and Drop Events
    dropZone.addEventListener("click", () => fileInput.click());
    
    dropZone.addEventListener("dragover", e => {
      e.preventDefault();
      dropZone.classList.add("dragover");
    });
    
    dropZone.addEventListener("dragleave", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
    });
    
    dropZone.addEventListener("drop", e => {
      e.preventDefault();
      dropZone.classList.remove("dragover");
      loadFile(e.dataTransfer.files[0]);
    });
    
    fileInput.addEventListener("change", e => loadFile(e.target.files[0]));

    // Load and process file
    async function loadFile(file) {
      if (!file) return;
      
      if (!file.name.toLowerCase().endsWith('.ogg')) {
        showStatus('Please select a valid OGG file.', 'error');
        return;
      }

      currentFile = file;
      addedFields.clear();
      
      // Show file info
      fileName.textContent = `File: ${file.name}`;
      fileSize.textContent = `Size: ${formatFileSize(file.size)}`;
      fileInfo.style.display = 'block';

      // Setup audio player
      audioPlayer.src = URL.createObjectURL(file);
      audioPlayer.style.display = 'block';

      try {
        // Read actual metadata from the OGG file
        await readActualMetadata(file);
        updateMetadataFoundDisplay();
        renderMetadataTable();
        updateAvailableFields();
        metadataSection.style.display = 'block';
        showStatus(`File loaded successfully! Found ${Object.keys(metadata).length} metadata fields.`);
      } catch (error) {
        showStatus('Error reading metadata: ' + error.message, 'error');
        console.error(error);
        // Fallback to basic file info
        metadata = extractBasicFileInfo(file);
        updateMetadataFoundDisplay();
        renderMetadataTable();
        updateAvailableFields();
        metadataSection.style.display = 'block';
      }
    }

    // Update metadata found display
    function updateMetadataFoundDisplay() {
      const foundFields = Object.keys(metadata).filter(key => metadata[key].trim() !== '');
      metadataCount.textContent = foundFields.length;
      
      if (foundFields.length === 0) {
        metadataFound.innerHTML = '<p style="color: #888;">No valid metadata found in file</p>';
        return;
      }
      
      const html = foundFields.map(field => 
        `<div class="metadata-item">
          <span class="checkmark">✓</span>
          <span class="key">${formatFieldName(field)}:</span>
          <span class="value">${metadata[field].substring(0, 100)}${metadata[field].length > 100 ? '...' : ''}</span>
        </div>`
      ).join('');
      
      metadataFound.innerHTML = html;
    }

    // Read and parse OGG metadata with improved filtering
    async function readActualMetadata(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          try {
            const arrayBuffer = e.target.result;
            const uint8Array = new Uint8Array(arrayBuffer);
            
            // Parse OGG Vorbis comments with better filtering
            const rawMetadata = parseVorbisComments(uint8Array);
            metadata = cleanMetadata(rawMetadata);
            originalMetadata = {...metadata};
            
            // Mark existing fields as added
            Object.keys(metadata).forEach(key => addedFields.add(key));
            
            resolve();
          } catch (error) {
            console.warn('Could not parse OGG metadata:', error);
            metadata = extractBasicFileInfo(file);
            originalMetadata = {...metadata};
            resolve();
          }
        };
        reader.onerror = () => reject(new Error('Failed to read file'));
        reader.readAsArrayBuffer(file);
      });
    }

    // Improved Vorbis comment parser with better validation
    function parseVorbisComments(data) {
      const rawMetadata = {};
      
      try {
        // Convert to string for searching, but be careful with encoding
        const searchData = data.slice(0, Math.min(data.length, 50000)); // Limit search area
        
        // Look for Vorbis comment header more precisely
        for (let i = 0; i < searchData.length - 10; i++) {
          // Look for the pattern: packet_type(1) + "vorbis"(6)
          if (searchData[i] === 0x03 && 
              searchData[i+1] === 0x76 && searchData[i+2] === 0x6f && 
              searchData[i+3] === 0x72 && searchData[i+4] === 0x62 && 
              searchData[i+5] === 0x69 && searchData[i+6] === 0x73) {
            
            // Found Vorbis comment header, parse from here
            const commentData = data.slice(i + 7);
            return extractVorbisComments(commentData);
          }
        }
        
        // Fallback: look for key=value patterns in a safer way
        return extractKeyValuePairs(data);
        
      } catch (error) {
        console.warn('Error parsing Vorbis comments:', error);
        return {};
      }
    }

    // Extract Vorbis comments from comment packet
    function extractVorbisComments(data) {
      const metadata = {};
      
      try {
        let offset = 0;
        const dataView = new DataView(data.buffer, data.byteOffset);
        
        // Skip vendor string
        if (offset + 4 > data.length) return metadata;
        const vendorLength = dataView.getUint32(offset, true);
        offset += 4 + vendorLength;
        
        // Read user comment list
        if (offset + 4 > data.length) return metadata;
        const userCommentListLength = dataView.getUint32(offset, true);
        offset += 4;
        
        for (let i = 0; i < userCommentListLength && offset < data.length - 4; i++) {
          const commentLength = dataView.getUint32(offset, true);
          offset += 4;
          
          if (offset + commentLength > data.length || commentLength > 1000) {
            break; // Prevent reading beyond bounds or unreasonably long comments
          }
          
          try {
            const commentBytes = data.slice(offset, offset + commentLength);
            const comment = new TextDecoder('utf-8', {fatal: true}).decode(commentBytes);
            
            const equalIndex = comment.indexOf('=');
            if (equalIndex > 0 && equalIndex < comment.length - 1) {
              const key = comment.substring(0, equalIndex).trim().toUpperCase();
              const value = comment.substring(equalIndex + 1).trim();
              
              if (key.length >= MIN_FIELD_LENGTH && key.length <= MAX_FIELD_LENGTH && 
                  value.length > 0 && value.length <= MAX_VALUE_LENGTH) {
                metadata[key] = value;
              }
            }
          } catch (decodeError) {
            // Skip invalid UTF-8 sequences
            console.warn('Skipping invalid UTF-8 comment');
          }
          
          offset += commentLength;
        }
        
      } catch (error) {
        console.warn('Error extracting Vorbis comments:', error);
      }
      
      return metadata;
    }

    // Fallback key-value extraction with strict validation
    function extractKeyValuePairs(data) {
      const metadata = {};
      
      try {
        // Convert to string but handle encoding carefully
        const textData = new TextDecoder('utf-8', {fatal: false}).decode(data.slice(0, 10000));
        
        // Look for patterns that look like metadata
        const keyValueRegex = /([A-Z][A-Z0-9_]{1,49})=([^\x00-\x1F\x7F-\x9F]{1,200})/g;
        let match;
        
        while ((match = keyValueRegex.exec(textData)) !== null && Object.keys(metadata).length < 50) {
          const key = match[1].trim();
          const value = match[2].trim();
          
          // Additional validation
          if (isValidMetadataField(key, value)) {
            metadata[key] = value;
          }
        }
        
      } catch (error) {
        console.warn('Error in fallback key-value extraction:', error);
      }
      
      return metadata;
    }

    // Render metadata table
    function renderMetadataTable() {
      metadataTableBody.innerHTML = "";
      
      // Get all fields (existing + standard ones)
      const allFields = new Set([...Object.keys(fieldDefinitions), ...Object.keys(metadata)]);
      
      // Sort fields: existing metadata first, then standard fields
      const sortedFields = Array.from(allFields).sort((a, b) => {
        const aHasValue = metadata[a] && metadata[a].trim() !== '';
        const bHasValue = metadata[b] && metadata[b].trim() !== '';
        const aIsStandard = fieldDefinitions.hasOwnProperty(a);
        const bIsStandard = fieldDefinitions.hasOwnProperty(b);
        
        if (aHasValue && !bHasValue) return -1;
        if (!aHasValue && bHasValue) return 1;
        if (aIsStandard && !bIsStandard) return -1;
        if (!aIsStandard && bIsStandard) return 1;
        return a.localeCompare(b);
      });
      
      // Add all fields to table
      sortedFields.forEach(field => {
        const value = metadata[field] || '';
        const hasOriginalValue = originalMetadata.hasOwnProperty(field) && originalMetadata[field].trim() !== '';
        const isAdded = addedFields.has(field) && !hasOriginalValue;
        addMetadataRow(field, value, hasOriginalValue, isAdded);
      });
    }

    // Add a metadata row to the table
    function addMetadataRow(key, value, hasOriginalValue = false, isAdded = false) {
      const row = document.createElement('tr');
      
      // Style rows differently based on source
      if (hasOriginalValue) {
        row.className = 'original-field';
      } else if (isAdded) {
        row.className = 'added-field';
      }
      
      const fieldDisplayName = formatFieldName(key);
      const isStandardField = fieldDefinitions.hasOwnProperty(key);
      
      row.innerHTML = `
        <td>
          <strong>${fieldDisplayName}</strong>
          ${hasOriginalValue ? '<span style="color: #4a4; font-size: 12px; margin-left: 8px;" title="Original metadata">●</span>' : ''}
          ${isAdded ? '<span style="color: #0080ff; font-size: 12px; margin-left: 8px;" title="Added field">+</span>' : ''}
          <input type="hidden" class="field-name" value="${key}">
        </td>
        <td>
          <input type="text" class="field-value" value="${value}" 
                 placeholder="Enter ${fieldDisplayName.toLowerCase()}"
                 maxlength="${MAX_VALUE_LENGTH}"
                 ${hasOriginalValue ? 'title="Original value from file"' : ''}>
        </td>
        <td>
          <button type="button" class="delete-row danger" onclick="deleteRow(this)" 
                  ${isStandardField && !hasOriginalValue && !isAdded ? 'style="display:none"' : ''}>Delete</button>
        </td>
      `;
      
      metadataTableBody.appendChild(row);
    }

    // Format field names for display
    function formatFieldName(fieldName) {
      if (fieldDefinitions[fieldName]) {
        return fieldDefinitions[fieldName].name;
      }
      
      // Convert UPPERCASE_FIELD to Title Case
      return fieldName.split('_')
        .map(word => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
        .join(' ');
    }

    // Delete a metadata row
    window.deleteRow = function(button) {
      const row = button.closest('tr');
      const fieldName = row.querySelector('.field-name').value;
      
      if (confirm(`Delete field "${formatFieldName(fieldName)}"?`)) {
        delete metadata[fieldName];
        addedFields.delete(fieldName);
        row.remove();
        updateMetadataFoundDisplay();
        updateAvailableFields();
        showStatus(`Field "${formatFieldName(fieldName)}" deleted.`);
      }
    };

    // Handle field type selection
    newFieldType.addEventListener('change', function() {
      const fieldType = this.value;
      
      if (fieldType === 'custom') {
        newFieldName.style.display = 'block';
        newFieldName.placeholder = 'Enter custom field name (UPPERCASE)';
        newFieldName.focus();
      } else {
        newFieldName.style.display = 'none';
        newFieldName.value = fieldType;
      }
    });

    // Add new field
    addFieldBtn.addEventListener('click', function() {
      const fieldType = newFieldType.value;
      
      if (!fieldType) {
        showStatus('Please select a field type.', 'error');
        return;
      }
      
      let fieldName = '';
      const fieldValue = newFieldValue.value.trim();
      
      if (!fieldValue) {
        showStatus('Please enter a field value.', 'error');
        return;
      }
      
      if (fieldType === 'custom') {
        fieldName = newFieldName.value.trim().toUpperCase();
        
        if (!fieldName) {
          showStatus('Please enter a field name.', 'error');
          return;
        }
        
        if (!VALID_FIELD_PATTERN.test(fieldName)) {
          showStatus('Field name must contain only letters, numbers, and underscores, starting with a letter.', 'error');
          return;
        }
        
        if (fieldName.length < MIN_FIELD_LENGTH || fieldName.length > MAX_FIELD_LENGTH) {
          showStatus(`Field name must be between ${MIN_FIELD_LENGTH} and ${MAX_FIELD_LENGTH} characters.`, 'error');
          return;
        }
      } else {
        fieldName = fieldType;
      }
      
      // Check if field already exists and has a value
      if (metadata.hasOwnProperty(fieldName) && metadata[fieldName].trim() !== '') {
        showStatus('This field already exists and has a value. Edit it in the table above.', 'error');
        return;
      }
      
      // Validate field value
      if (!isValidMetadataField(fieldName, fieldValue)) {
        showStatus('Invalid field value. Please check for special characters or length.', 'error');
        return;
      }
      
      // Add to metadata
      metadata[fieldName] = fieldValue;
      addedFields.add(fieldName);
      
      // Re-render table to maintain proper sorting
      renderMetadataTable();
      updateMetadataFoundDisplay();
      updateAvailableFields();
      
      // Reset form
      newFieldType.value = '';
      newFieldName.value = '';
      newFieldName.style.display = 'none';
      newFieldValue.value = '';
      
      showStatus(`Field "${formatFieldName(fieldName)}" added successfully.`);
    });

    // Save metadata
    metadataForm.addEventListener("submit", async e => {
      e.preventDefault();
      
      // Collect all metadata from the table
      const rows = metadataTableBody.querySelectorAll('tr');
      const newMetadata = {};
      
      rows.forEach(row => {
        const nameInput = row.querySelector('.field-name');
        const valueInput = row.querySelector('.field-value');
        
        if (nameInput && valueInput) {
          const name = nameInput.value.trim().toUpperCase();
          const value = valueInput.value.trim();
          
          if (name && value && isValidMetadataField(name, value)) {
            newMetadata[name] = value;
          }
        }
      });
      
      try {
        // Create a metadata file
        const metadataEntries = Object.entries(newMetadata);
        const metadataText = metadataEntries
          .map(([key, value]) => `${key}=${value}`)
          .join('\n');
        
        // Add header information
        const fullMetadataText = `# OGG Metadata Export
# Generated by Enhanced OGG Metadata Editor
# Original file: ${currentFile.name}
# Export date: ${new Date().toISOString()}
# Total fields: ${metadataEntries.length}

${metadataText}`;
        
        const blob = new Blob([fullMetadataText], { type: 'text/plain' });
        
        // Update global metadata
        metadata = newMetadata;
        
        // Create download link
        downloadLink.href = URL.createObjectURL(blob);
        downloadLink.download = `${currentFile.name.replace('.ogg', '')}_metadata.txt`;
        downloadLink.style.display = "block";
        downloadLink.textContent = "📥 Download Metadata File";
        
        showStatus(`Metadata file created successfully! ${metadataEntries.length} fields exported.`);
        
      } catch (error) {
        showStatus('Error saving metadata: ' + error.message, 'error');
        console.error(error);
      }
    });

    // Extract basic file info if metadata parsing fails
    function extractBasicFileInfo(file) {
      const baseName = file.name.replace(/\.[^/.]+$/, "");
      return {
        'TITLE': baseName,
        'DATE': new Date().getFullYear().toString()
      };
    }

    // Handle Enter key in new field inputs
    newFieldValue.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addFieldBtn.click();
      }
    });

    newFieldName.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        newFieldValue.focus();
      }
    });

    // Auto-uppercase custom field names
    newFieldName.addEventListener('input', function() {
      this.value = this.value.toUpperCase().replace(/[^A-Z0-9_]/g, '');
    });

    // Validate field values on input
    document.addEventListener('input', function(e) {
      if (e.target.classList.contains('field-value')) {
        const value = e.target.value;
        if (value.length > MAX_VALUE_LENGTH) {
          e.target.value = value.substring(0, MAX_VALUE_LENGTH);
          showStatus(`Value truncated to ${MAX_VALUE_LENGTH} characters.`, 'error');
        }
      }
    });

    // Save changes automatically when editing existing fields
    document.addEventListener('input', function(e) {
      if (e.target.classList.contains('field-value')) {
        const row = e.target.closest('tr');
        const fieldName = row.querySelector('.field-name').value;
        const fieldValue = e.target.value;
        
        if (fieldName && isValidMetadataField(fieldName, fieldValue)) {
          metadata[fieldName] = fieldValue;
          updateMetadataFoundDisplay();
        }
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
      updateAvailableFields();
      showStatus('Ready to load OGG files. Drag and drop or click to browse.');
    });
  </script>
</body>
</html>
